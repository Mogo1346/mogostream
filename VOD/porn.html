<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אתר וידאו - API חינם</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #141414;
            color: #ffffff;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #ff0055;
        }

        /* גריד רספונסיבי לסרטונים */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* כרטיסיית סרטון */
        .video-card {
            background-color: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* יחס 16:9 */
            background-color: #000;
        }

        .thumbnail-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .duration {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.8);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }

        .video-info {
            padding: 12px;
        }

        .video-title {
            font-size: 14px;
            font-weight: bold;
            line-height: 1.3;
            height: 36px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* חלון צף לנגן (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
        }

        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            position: absolute;
            top: -35px;
            right: 0;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>גלריית סרטונים (RedTube API)</h1>
    <div class="video-grid" id="videoGrid"></div>

    <!-- חלון צף לנגן -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <iframe id="playerFrame" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.redtube.com/?data=redtube.Videos.searchVideos&output=json&thumbsize=medium';

        // טעינת סרטונים מה-API
        async function loadVideos() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                const grid = document.getElementById('videoGrid');
                grid.innerHTML = '';

                data.videos.forEach(item => {
                    const video = item.video;
                    
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.onclick = () => openModal(video.embed_url);

                    card.innerHTML = `
                        <div class="thumbnail-container">
                            <img src="${video.default_thumb}" alt="${video.title}">
                            <span class="duration">${video.duration}</span>
                        </div>
                        <div class="video-info">
                            <div class="video-title">${video.title}</div>
                        </div>
                    `;

                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('שגיאה שטעינת הסרטונים:', error);
            }
        }

        // פתיחת הנגן
        function openModal(embedUrl) {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('playerFrame');
            iframe.src = embedUrl;
            modal.style.display = 'flex';
        }

        // סגירת הנגן
        function closeModal() {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('playerFrame');
            iframe.src = '';
            modal.style.display = 'none';
        }

        // הפעלה בטעינת העמוד
        loadVideos();
    </script>
</body>
</html>
