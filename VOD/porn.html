<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אתר וידאו - GitHub Pages</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #141414; color: #fff; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; color: #ff0055; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .video-card { background-color: #1f1f1f; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .video-card:hover { transform: translateY(-5px); }
        .thumbnail-container { position: relative; width: 100%; padding-top: 56.25%; background-color: #000; }
        .thumbnail-container img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .video-info { padding: 12px; }
        .video-title { font-size: 14px; font-weight: bold; height: 36px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { position: relative; width: 90%; max-width: 800px; aspect-ratio: 16 / 9; }
        .modal-content iframe { width: 100%; height: 100%; border: none; }
        .close-btn { position: absolute; top: -35px; right: 0; color: #fff; font-size: 28px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>גלריית סרטונים</h1>
    <div class="video-grid" id="videoGrid"></div>

    <div class="modal" id="videoModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <iframe id="playerFrame" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // API חופשי שתומך ב-CORS ב-GitHub Pages
        const API_URL = 'https://www.eporner.com/api/v2/webmaster/search/?per_page=16&format=json';

        async function loadVideos() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const data = await response.json();
                const grid = document.getElementById('videoGrid');
                grid.innerHTML = '';

                if (data && data.videos && Array.isArray(data.videos)) {
                    data.videos.forEach(video => {
                        const card = document.createElement('div');
                        card.className = 'video-card';
                        card.onclick = () => openModal(video.embed);

                        card.innerHTML = `
                            <div class="thumbnail-container">
                                <img src="${video.default_thumb.src}" alt="${video.title}">
                            </div>
                            <div class="video-info">
                                <div class="video-title">${video.title}</div>
                            </div>
                        `;

                        grid.appendChild(card);
                    });
                }
            } catch (error) {
                console.error('שגיאה:', error);
                document.getElementById('videoGrid').innerHTML = `<p style="text-align:center; width:100%; color:red;">שגיאה בטעינת הנתונים: ${error.message}</p>`;
            }
        }

        function openModal(embedUrl) {
            document.getElementById('playerFrame').src = embedUrl;
            document.getElementById('videoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('playerFrame').src = '';
            document.getElementById('videoModal').style.display = 'none';
        }

        loadVideos();
    </script>
</body>
</html>
