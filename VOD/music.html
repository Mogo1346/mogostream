<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groove — הכספת שלך למוזיקה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12151b;
    --surface: #1b202a;
    --surface-2: #232b38;
    --accent: #e8a33d;
    --accent-dark: #a86f22;
    --accent-2: #4fd1c5;
    --text: #f2efe9;
    --text-muted: #8890a0;
    --border: rgba(255,255,255,0.08);
    --danger: #e2504f;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }
  ::selection { background: var(--accent); color: #1a1200; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .app {
    display: grid;
    grid-template-columns: 250px 1fr;
    grid-template-rows: 1fr auto;
    height: 100vh;
  }

  .sidebar {
    grid-row: 1;
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .logo {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 26px;
    letter-spacing: -0.5px;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo .dot { color: var(--accent); }
  .tagline {
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 0 28px;
  }
  .nav-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin: 0 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 2px;
    transition: background 0.15s;
    border: none;
    background: none;
    width: 100%;
    text-align: right;
    font-family: inherit;
  }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item.active { background: var(--surface-2); color: var(--accent); }
  .nav-item .icon { width: 18px; text-align: center; opacity: 0.85; font-size: 15px; }
  .crate-count {
    margin-right: auto;
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }
  .new-crate-btn {
    margin-top: 10px;
    padding: 9px 10px;
    border-radius: var(--radius);
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    text-align: center;
    font-family: inherit;
  }
  .new-crate-btn:hover { border-color: var(--accent); color: var(--accent); }
  .new-crate-form { display: flex; gap: 6px; margin-top: 8px; }
  .new-crate-form input {
    flex: 1; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 7px 9px; font-size: 13px; font-family: inherit;
  }
  .new-crate-form button {
    background: var(--accent); border: none; color: #1a1200; border-radius: 8px;
    padding: 0 12px; font-weight: 600; cursor: pointer; font-size: 13px;
  }

  .main {
    grid-row: 1;
    overflow-y: auto;
    padding: 28px 36px 40px;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
  }
  .search-box {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 6px 4px 18px;
    max-width: 520px;
  }
  .search-box input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-size: 14px; padding: 8px 0; font-family: inherit;
  }
  .search-box input::placeholder { color: var(--text-muted); }
  .search-box button {
    background: var(--accent); border: none; color: #1a1200;
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    font-size: 15px; display: flex; align-items: center; justify-content: center;
  }
  .view-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0 0 4px;
  }
  .view-sub { color: var(--text-muted); font-size: 13px; margin: 0 0 22px; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 32px; }
  .chip {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 9px 18px; border-radius: 999px; font-size: 13px; cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
  }
  .track-card {
    background: var(--surface);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }
  .track-card:hover { border-color: var(--accent-dark); transform: translateY(-2px); }
  .art-wrap { position: relative; width: 100%; aspect-ratio: 1/1; background: var(--surface-2); }
  .art-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play-overlay {
    position: absolute; inset: 0; background: rgba(10,12,16,0.35);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.15s;
  }
  .track-card:hover .play-overlay { opacity: 1; }
  .play-overlay .play-btn {
    width: 42px; height: 42px; border-radius: 50%; background: var(--accent);
    color: #1a1200; border: none; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .track-card.playing .art-wrap::after {
    content: ''; position: absolute; inset: 0; border: 2px solid var(--accent-2); border-radius: 12px 12px 0 0;
  }
  .card-body { padding: 10px 12px 12px; }
  .card-title {
    font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-artist {
    font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
  }
  .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .add-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .add-btn:hover { border-color: var(--accent); color: var(--accent); }
  .no-preview-tag { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

  .crate-dropdown {
    position: absolute; bottom: 30px; left: 12px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px; padding: 6px; z-index: 20;
    min-width: 150px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .crate-dropdown-item {
    padding: 7px 10px; font-size: 13px; border-radius: 6px; cursor: pointer; text-align: right;
  }
  .crate-dropdown-item:hover { background: var(--surface); color: var(--accent); }

  .list-row {
    display: flex; align-items: center; gap: 14px; padding: 9px 10px; border-radius: 8px; cursor: pointer;
  }
  .list-row:hover { background: var(--surface); }
  .list-row.playing { background: var(--surface); }
  .list-row .idx { width: 22px; text-align: center; color: var(--text-muted); font-size: 12px; font-family: 'JetBrains Mono', monospace; }
  .list-row img { width: 42px; height: 42px; border-radius: 6px; object-fit: cover; }
  .list-row .meta { flex: 1; min-width: 0; }
  .list-row .meta .t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-row .meta .a { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-row .remove-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 15px; padding: 6px; }
  .list-row .remove-btn:hover { color: var(--danger); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-state .big { font-size: 40px; margin-bottom: 12px; }

  .player-bar {
    grid-column: 1 / 3;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 22px;
    height: 84px;
  }
  .yt-mini {
    width: 120px; height: 68px; border-radius: 8px; overflow: hidden;
    background: #000; flex-shrink: 0; display: none; border: 1px solid var(--border);
  }
  .yt-mini.active { display: block; }
  .yt-mini #yt-player, .yt-mini iframe { width: 100% !important; height: 100% !important; display: block; }

  .now-playing-meta { width: 170px; flex-shrink: 0; min-width: 0; }
  .now-playing-meta .t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-playing-meta .a { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .transport { display: flex; align-items: center; gap: 14px; }
  .transport button {
    background: none; border: none; color: var(--text); cursor: pointer; font-size: 17px;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  }
  .transport .play-pause {
    width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #1a1200; font-size: 15px;
  }
  .transport button:disabled { opacity: 0.3; cursor: default; }

  .progress-wrap { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 120px; }
  .progress-wrap span { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; width: 34px; }
  .progress-track {
    flex: 1; height: 4px; background: var(--surface-2); border-radius: 4px; cursor: pointer; position: relative;
    touch-action: none;
  }
  .progress-fill { position: absolute; top: 0; right: 0; height: 100%; background: var(--accent); border-radius: 4px; width: 0%; }
  .progress-thumb {
    position: absolute; top: 50%; right: 0%; width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); transform: translate(50%, -50%);
    box-shadow: 0 0 0 3px rgba(232,163,61,0.25); opacity: 0; transition: opacity 0.15s; pointer-events: none;
  }
  .progress-track:hover .progress-thumb, .progress-track.dragging .progress-thumb { opacity: 1; }
  .progress-track.dragging { cursor: grabbing; }

  .volume-wrap { display: flex; align-items: center; gap: 6px; width: 100px; flex-shrink: 0; }
  .volume-wrap input[type=range] { width: 80px; accent-color: var(--accent); }

  .placeholder-player { color: var(--text-muted); font-size: 13px; }
  a { color: var(--accent); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(8,9,12,0.62);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-box {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px;
    padding: 24px; width: 320px; box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .modal-box h3 { font-family: 'Fraunces', serif; font-size: 18px; margin: 0 0 10px; font-weight: 600; }
  .modal-box p { font-size: 13px; color: var(--text-muted); margin: 0 0 20px; line-height: 1.5; }
  .modal-actions { display: flex; justify-content: flex-start; gap: 10px; }
  .modal-actions button {
    padding: 9px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; border: none; font-family: inherit; font-weight: 600;
  }
  .modal-cancel { background: var(--surface); color: var(--text); border: 1px solid var(--border) !important; }
  .modal-confirm { background: var(--danger); color: #fff; }

  .play-all-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: #1a1200; border: none; border-radius: 999px;
    padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .shuffle-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 9px 16px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .shuffle-btn:hover, .play-all-btn:hover { filter: brightness(1.08); }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <p class="logo">GROOVE<span class="dot">•</span></p>
    <p class="tagline">חפש שיר ונגן אותו במלואו דרך יוטיוב</p>

    <button class="nav-item active" id="nav-home" onclick="setView({type:'home'})">
      <span class="icon">⌂</span> בית
    </button>

    <p class="nav-label" style="margin-top:22px;">הפלייליסטים שלך</p>
    <div id="crates-list"></div>
    <button class="new-crate-btn" onclick="toggleNewCrateForm()">+ פלייליסט חדש</button>
    <div class="new-crate-form" id="new-crate-form" style="display:none;">
      <input id="new-crate-input" placeholder="שם הפלייליסט" onkeydown="if(event.key==='Enter')createCrate()">
      <button onclick="createCrate()">צור</button>
    </div>
  </aside>

  <main class="main" id="main">
  </main>

  <footer class="player-bar" id="player-bar">
    <div class="yt-mini" id="yt-mini"><div id="yt-player"></div></div>
    <div id="player-bar-controls" style="display:flex;align-items:center;gap:16px;flex:1;">
      <div class="placeholder-player">בחר שיר כדי לנגן את השיר המלא ביוטיוב</div>
    </div>
  </footer>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <p id="modal-message"></p>
    <div class="modal-actions">
      <button class="modal-confirm" id="modal-confirm-btn">מחק</button>
      <button class="modal-cancel" onclick="closeModal()">ביטול</button>
    </div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const YT_API_KEY = "AIzaSyCaOTvkOfD9drrlteSpb6WwTpjnBbJS0CY";
const GENRES = ["Lo-fi", "מיינסטרים ישראלי", "Hip Hop", "Indie Rock", "Jazz", "K-Pop", "Latin Pop", "Electronic", "Classical", "R&B"];

let state = {
  crates: [],
  view: { type: 'home' },
  results: [],
  queue: [],
  queueIndex: -1,
  isPlaying: false,
  loadingTrack: null
};

let ytPlayer = null;
let ytReady = false;
let pendingVideoId = null;
let progressInterval = null;
let isDraggingProgress = false;

// קאש פשוט בזיכרון כדי לא לבזבז קריאות API על אותו שיר פעמיים באותה הפעלה
const videoIdCache = {};

function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('yt-player', {
    height: '68',
    width: '120',
    playerVars: { autoplay: 0, controls: 1, modestbranding: 1, rel: 0 },
    events: {
      onReady: function() {
        ytReady = true;
        if (pendingVideoId) { ytPlayer.loadVideoById(pendingVideoId); pendingVideoId = null; }
      },
      onStateChange: onPlayerStateChange
    }
  });
}

function onPlayerStateChange(e) {
  if (e.data === YT.PlayerState.PLAYING) {
    state.isPlaying = true;
    startProgressPoll();
  } else if (e.data === YT.PlayerState.PAUSED) {
    state.isPlaying = false;
    stopProgressPoll();
  } else if (e.data === YT.PlayerState.ENDED) {
    state.isPlaying = false;
    stopProgressPoll();
    renderPlayerBar();
    renderMain();
    playNext();
    return;
  }
  renderPlayerBar();
  renderMain();
}

function startProgressPoll() {
  stopProgressPoll();
  progressInterval = setInterval(updateProgressUI, 500);
}
function stopProgressPoll() {
  if (progressInterval) clearInterval(progressInterval);
  progressInterval = null;
}
function updateProgressUI() {
  if (isDraggingProgress) return;
  if (!ytPlayer || !ytPlayer.getCurrentTime) return;
  const cur = ytPlayer.getCurrentTime();
  const dur = ytPlayer.getDuration();
  const pct = dur ? (cur/dur*100) : 0;
  const fill = document.getElementById('progress-fill');
  const thumb = document.getElementById('progress-thumb');
  const curEl = document.getElementById('cur-time');
  const durEl = document.getElementById('dur-time');
  if (fill && dur) fill.style.width = pct + '%';
  if (thumb && dur) thumb.style.right = pct + '%';
  if (curEl) curEl.textContent = fmtTime(cur);
  if (durEl) durEl.textContent = fmtTime(dur);
}

// ---- התאמת סרטון יוטיוב משופרת ----
// במקום לקחת בעיוורון את התוצאה הראשונה (maxResults=1), אנחנו מביאים כמה
// מועמדים, מביאים את פרטי המשך שלהם (כולל סטטיסטיקת צפיות), ומנקדים אותם
// לפי כותרת/ערוץ/משך זמן/כמות צפיות, כדי להגדיל את הסיכוי שיימצא בדיוק
// הסרטון עם השיר המבוקש, ומתוך הגרסאות הסבירות - זו שנחשבת הכי "רשמית"
// ופופולרית.
async function searchYoutubeVideoId(query, targetDurationSec) {
  const cacheKey = query + '|' + (targetDurationSec || '');
  if (videoIdCache[cacheKey] !== undefined) return videoIdCache[cacheKey];

  const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=8&type=video&videoCategoryId=10&q=${encodeURIComponent(query)}&key=${YT_API_KEY}`;
  const searchRes = await fetch(searchUrl);
  const searchData = await searchRes.json();
  if (searchData.error) throw new Error(searchData.error.message || 'YouTube API error');

  const items = searchData.items || [];
  if (!items.length) {
    videoIdCache[cacheKey] = null;
    return null;
  }

  const ids = items.map(i => i.id.videoId).join(',');
  // הוספנו "statistics" ל-part כדי לקבל גם את viewCount לכל מועמד.
  const detailsRes = await fetch(
    `https://www.googleapis.com/youtube/v3/videos?part=contentDetails,snippet,topicDetails,statistics&id=${ids}&key=${YT_API_KEY}`
  );
  const detailsData = await detailsRes.json();
  if (detailsData.error) throw new Error(detailsData.error.message || 'YouTube API error');

  // מילות מפתח שמעידות על גרסה שאינה השיר המקורי המלא (אינסטרומנטל, קריוקי וכו').
  // נבדקות גם בכותרת וגם בתיאור, כי לא כל יוצר תוכן מציין את זה בכותרת עצמה.
  const NON_ORIGINAL_PATTERN = /live|cover|remix|reaction|lyrics(?!\s*video)|karaoke|8d audio|slowed|sped up|instrumental|no vocals|backing track|minus one|acapella|a cappella|tutorial|piano version|guitar version/;

  const scored = (detailsData.items || []).map(v => {
    let score = 0;
    const title = (v.snippet.title || '').toLowerCase();
    const description = (v.snippet.description || '').toLowerCase();
    const channel = (v.snippet.channelTitle || '').toLowerCase();
    const durSec = parseISODuration(v.contentDetails.duration);
    const viewCount = parseInt((v.statistics && v.statistics.viewCount) || '0', 10);
    const combinedText = title + ' ' + description.slice(0, 300); // רק תחילת התיאור, מספיק לרוב היוצרים

    if (/official audio|official video|official music video/.test(title)) score += 3;
    if (channel.endsWith('- topic')) score += 4; // ערוצי "Topic" הם ערוצי מטא-דאטה רשמיים של יוטיוב מיוזיק, כמעט לעולם לא גרסאות אינסטרומנטליות
    if (NON_ORIGINAL_PATTERN.test(combinedText)) score -= 6;

    if (targetDurationSec && durSec) {
      const diff = Math.abs(durSec - targetDurationSec);
      if (diff <= 5) score += 5;
      else if (diff <= 15) score += 2;
      else if (diff > 60) score -= 5;
    }

    // בונוס לפי כמות צפיות, בסולם לוגריתמי (base 10) כדי שהפרש בין
    // 1K ל-10K צפיות ישקול כמו הפרש בין 1M ל-10M, ולא שסרטון ויראלי
    // אחד ינצח אוטומטית כל שיקול אחר. תקרה של +6 כדי לא לתת לפופולריות
    // לגבור על סימני "לא-מקורי" (למשל קאבר ויראלי עם המון צפיות).
    if (viewCount > 0) {
      const viewScore = Math.log10(viewCount) - 3; // 1K צפיות = 0, 1M = +3, 1B = +6
      score += Math.max(0, Math.min(6, viewScore));
    }

    return { videoId: v.id, score };
  });

  scored.sort((a, b) => b.score - a.score);
  const best = scored[0] ? scored[0].videoId : items[0].id.videoId;
  videoIdCache[cacheKey] = best;
  return best;
}

function parseISODuration(iso) {
  const m = (iso || '').match(/PT(\d+H)?(\d+M)?(\d+S)?/);
  if (!m) return 0;
  const h = parseInt(m[1]) || 0, min = parseInt(m[2]) || 0, s = parseInt(m[3]) || 0;
  return h * 3600 + min * 60 + s;
}

const audioUnused = null;

const CRATES_STORAGE_KEY = 'groove_crates_v1';

async function loadCrates() {
  try {
    const raw = localStorage.getItem(CRATES_STORAGE_KEY);
    state.crates = raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error('טעינת הפלייליסטים נכשלה', e);
    state.crates = [];
  }
  renderCratesList();
}

async function saveCrates() {
  try {
    localStorage.setItem(CRATES_STORAGE_KEY, JSON.stringify(state.crates));
  } catch (e) {
    console.error('שמירת הפלייליסטים נכשלה', e);
  }
}

function renderCratesList() {
  const el = document.getElementById('crates-list');
  if (!state.crates.length) {
    el.innerHTML = '<p style="font-size:12px;color:var(--text-muted);padding:4px 10px;">עוד אין פלייליסטים</p>';
    return;
  }
  el.innerHTML = state.crates.map(c => `
    <button class="nav-item ${state.view.type==='crate' && state.view.id===c.id ? 'active':''}" onclick='setView({type:"crate",id:"${c.id}"})'>
      <span class="icon">▤</span> ${escapeHtml(c.name)}
      <span class="crate-count">${c.tracks.length}</span>
    </button>
  `).join('');
}

function toggleNewCrateForm() {
  const f = document.getElementById('new-crate-form');
  f.style.display = f.style.display === 'none' ? 'flex' : 'none';
  if (f.style.display === 'flex') document.getElementById('new-crate-input').focus();
}

async function createCrate() {
  const input = document.getElementById('new-crate-input');
  const name = input.value.trim();
  if (!name) return;
  const crate = { id: 'c' + Date.now(), name, tracks: [] };
  state.crates.push(crate);
  input.value = '';
  document.getElementById('new-crate-form').style.display = 'none';
  await saveCrates();
  renderCratesList();
}

async function deleteCrate(id) {
  state.crates = state.crates.filter(c => c.id !== id);
  await saveCrates();
  renderCratesList();
  if (state.view.type === 'crate' && state.view.id === id) setView({type:'home'});
}

let modalConfirmCallback = null;

function showConfirmModal(title, message, onConfirm) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-message').textContent = message;
  modalConfirmCallback = onConfirm;
  document.getElementById('modal-overlay').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
  modalConfirmCallback = null;
}

document.getElementById('modal-confirm-btn').addEventListener('click', () => {
  if (modalConfirmCallback) modalConfirmCallback();
  closeModal();
});

document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'modal-overlay') closeModal();
});

function confirmDeleteCrate(id) {
  const crate = state.crates.find(c => c.id === id);
  if (!crate) return;
  showConfirmModal(
    `למחוק את "${crate.name}"?`,
    'הפעולה תמחק את הפלייליסט ואת כל השירים שבתוכו לצמיתות. לא ניתן לבטל את זה.',
    () => deleteCrate(id)
  );
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function playAllCrate(id) {
  const crate = state.crates.find(c => c.id === id);
  if (!crate || !crate.tracks.length) return;
  playQueue(crate.tracks, 0);
}

function shufflePlayCrate(id) {
  const crate = state.crates.find(c => c.id === id);
  if (!crate || !crate.tracks.length) return;
  playQueue(shuffleArray(crate.tracks), 0);
}

async function addToCrate(crateId, track) {
  const crate = state.crates.find(c => c.id === crateId);
  if (!crate) return;
  if (crate.tracks.some(t => t.trackId === track.trackId)) return;
  crate.tracks.push(track);
  await saveCrates();
  renderCratesList();
  if (state.view.type === 'crate' && state.view.id === crateId) renderMain();
}

async function removeFromCrate(crateId, trackId) {
  const crate = state.crates.find(c => c.id === crateId);
  if (!crate) return;
  crate.tracks = crate.tracks.filter(t => t.trackId !== trackId);
  await saveCrates();
  renderCratesList();
  renderMain();
}

function escapeHtml(str) {
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

async function searchItunes(term) {
  const url = `https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=music&limit=28`;
  const res = await fetch(url);
  const data = await res.json();
  return (data.results||[]).map(r => ({
    trackId: String(r.trackId),
    title: r.trackName,
    artist: r.artistName,
    artwork: (r.artworkUrl100||'').replace('100x100bb','300x300bb'),
    duration: r.trackTimeMillis ? Math.round(r.trackTimeMillis/1000) : null
  }));
}

function setView(v) {
  state.view = v;
  document.getElementById('nav-home').classList.toggle('active', v.type === 'home');
  renderCratesList();
  renderMain();
}

async function doSearch(term) {
  if (!term || !term.trim()) return;
  setView({type:'search', term, loading:true});
  try {
    const tracks = await searchItunes(term);
    state.results = tracks;
    setView({type:'search', term, loading:false});
  } catch(e) {
    state.results = [];
    setView({type:'search', term, loading:false, error:true});
  }
}

function renderMain() {
  const main = document.getElementById('main');
  const v = state.view;

  if (v.type === 'home') {
    main.innerHTML = `
      <div class="topbar">
        <div class="search-box">
          <input id="search-input" placeholder="חפש שיר, אמן או אלבום..." onkeydown="if(event.key==='Enter')doSearch(this.value)">
          <button onclick="doSearch(document.getElementById('search-input').value)">→</button>
        </div>
      </div>
      <h1 class="view-title">מה מנגנים היום?</h1>
      <p class="view-sub">בחר ז'אנר כדי לגלות, או חפש שיר ספציפי</p>
      <div class="chip-row">
        ${GENRES.map(g => `<button class="chip" onclick='doSearch("${g}")'>${g}</button>`).join('')}
      </div>
    `;
    return;
  }

  if (v.type === 'search') {
    main.innerHTML = `
      <div class="topbar">
        <div class="search-box">
          <input id="search-input" value="${escapeHtml(v.term)}" placeholder="חפש שיר, אמן או אלבום..." onkeydown="if(event.key==='Enter')doSearch(this.value)">
          <button onclick="doSearch(document.getElementById('search-input').value)">→</button>
        </div>
      </div>
      <h1 class="view-title">תוצאות עבור "${escapeHtml(v.term)}"</h1>
      <p class="view-sub">${v.loading ? 'מחפש...' : (state.results.length + ' שירים נמצאו · לחץ כדי לנגן את השיר המלא')}</p>
      <div class="grid" id="results-grid"></div>
    `;
    if (!v.loading) {
      const grid = document.getElementById('results-grid');
      if (!state.results.length) {
        grid.innerHTML = '<div class="empty-state"><div class="big">♪</div>לא נמצאו שירים</div>';
      } else {
        grid.innerHTML = state.results.map((t, i) => trackCardHtml(t, i)).join('');
      }
    }
    return;
  }

  if (v.type === 'crate') {
    const crate = state.crates.find(c => c.id === v.id);
    if (!crate) { setView({type:'home'}); return; }
    main.innerHTML = `
      <div class="topbar">
        <h1 class="view-title" style="margin:0;">${escapeHtml(crate.name)}</h1>
        <button class="chip" style="margin-right:auto;color:var(--danger);" onclick='confirmDeleteCrate("${crate.id}")'>מחק פלייליסט</button>
      </div>
      <p class="view-sub">${crate.tracks.length} שירים</p>
      ${crate.tracks.length ? `
      <div style="display:flex;gap:10px;margin-bottom:22px;">
        <button class="play-all-btn" onclick='playAllCrate("${crate.id}")'>▶ נגן הכל</button>
        <button class="shuffle-btn" onclick='shufflePlayCrate("${crate.id}")'>🔀 ניגון אקראי</button>
      </div>` : ''}
      <div id="crate-tracks"></div>
    `;
    const list = document.getElementById('crate-tracks');
    if (!crate.tracks.length) {
      list.innerHTML = '<div class="empty-state"><div class="big">▤</div>הפלייליסט עדיין ריק. חפש שירים והוסף אותם כאן.</div>';
    } else {
      list.innerHTML = crate.tracks.map((t, i) => `
        <div class="list-row ${isCurrentTrack(t) ? 'playing':''}" onclick='playQueue(${JSON.stringify(crate.tracks).replace(/'/g,"&#39;")}, ${i})'>
          <span class="idx">${i+1}</span>
          <img src="${t.artwork}" alt="">
          <div class="meta">
            <div class="t">${escapeHtml(t.title)}</div>
            <div class="a">${escapeHtml(t.artist)}</div>
          </div>
          <button class="remove-btn" onclick='event.stopPropagation();removeFromCrate("${crate.id}","${t.trackId}")'>✕</button>
        </div>
      `).join('');
    }
    return;
  }
}

function trackCardHtml(t, i) {
  const playing = isCurrentTrack(t);
  return `
    <div class="track-card ${playing?'playing':''}" onclick='playQueue(${JSON.stringify(state.results).replace(/'/g,"&#39;")}, ${i})'>
      <div class="art-wrap">
        <img src="${t.artwork}" alt="" loading="lazy">
        <div class="play-overlay"><button class="play-btn">${playing && state.isPlaying ? '❚❚' : '▶'}</button></div>
      </div>
      <div class="card-body">
        <div class="card-title">${escapeHtml(t.title)}</div>
        <div class="card-artist">${escapeHtml(t.artist)}</div>
        <div class="card-actions">
          <span class="no-preview-tag">${t.duration ? fmtTime(t.duration) : ''}</span>
          <button class="add-btn" onclick='event.stopPropagation();toggleDropdown(event,"${t.trackId}")'>+</button>
        </div>
      </div>
    </div>
  `;
}

function toggleDropdown(ev, trackId) {
  document.querySelectorAll('.crate-dropdown').forEach(d => d.remove());
  if (!state.crates.length) {
    alert('צור קודם פלייליסט מהסיידבר');
    return;
  }
  const btn = ev.currentTarget;
  const track = state.results.find(t => t.trackId === trackId) ||
    (state.view.type==='crate' ? state.crates.find(c=>c.id===state.view.id)?.tracks.find(t=>t.trackId===trackId) : null);
  const dd = document.createElement('div');
  dd.className = 'crate-dropdown';
  dd.innerHTML = state.crates.map(c => `<div class="crate-dropdown-item" data-crate="${c.id}">${escapeHtml(c.name)}</div>`).join('');
  btn.parentElement.style.position = 'relative';
  btn.parentElement.appendChild(dd);
  dd.querySelectorAll('.crate-dropdown-item').forEach(item => {
    item.onclick = (e) => {
      e.stopPropagation();
      addToCrate(item.dataset.crate, track);
      dd.remove();
    };
  });
  setTimeout(() => {
    document.addEventListener('click', function closeDd(e) {
      if (!dd.contains(e.target)) { dd.remove(); document.removeEventListener('click', closeDd); }
    });
  }, 0);
}

function isCurrentTrack(t) {
  return state.queueIndex >= 0 && state.queue[state.queueIndex] && state.queue[state.queueIndex].trackId === t.trackId;
}

async function playQueue(queue, index) {
  state.queue = queue;
  state.queueIndex = index;
  const track = queue[index];
  state.loadingTrack = track;
  document.getElementById('yt-mini').classList.add('active');
  renderPlayerBar();
  renderMain();
  try {
    const videoId = await searchYoutubeVideoId(`${track.artist} - ${track.title} audio`, track.duration);
    state.loadingTrack = null;
    if (!videoId) {
      alert('לא נמצא סרטון מתאים ביוטיוב עבור השיר הזה');
      renderPlayerBar();
      return;
    }
    if (ytPlayer && ytReady) {
      ytPlayer.loadVideoById(videoId);
    } else {
      pendingVideoId = videoId;
    }
    renderPlayerBar();
  } catch (e) {
    state.loadingTrack = null;
    console.error(e);
    alert('שגיאה בחיפוש ביוטיוב: ' + (e.message||e));
    renderPlayerBar();
  }
}

function togglePlayPause() {
  if (!ytPlayer || state.queueIndex < 0) return;
  const s = ytPlayer.getPlayerState ? ytPlayer.getPlayerState() : -1;
  if (s === 1) ytPlayer.pauseVideo();
  else ytPlayer.playVideo();
}

function playNext() {
  if (state.queueIndex < 0 || state.queueIndex+1 >= state.queue.length) return;
  playQueue(state.queue, state.queueIndex+1);
}

function playPrev() {
  if (state.queueIndex <= 0) return;
  playQueue(state.queue, state.queueIndex-1);
}

function pctFromPointerEvent(ev, trackEl) {
  const rect = trackEl.getBoundingClientRect();
  // הבר מוצג ב-RTL: הקצה הימני = תחילת השיר (0%), הקצה השמאלי = סוף השיר (100%).
  // חישוב האחוז חייב להתבסס על rect.right ולא rect.left, אחרת נקודת הלחיצה
  // לא תואמת לנקודה שבה מוצג הסמן (זה היה הבאג).
  let pct = (rect.right - ev.clientX) / rect.width;
  if (pct < 0) pct = 0;
  if (pct > 1) pct = 1;
  return pct;
}

function setProgressVisual(pct) {
  const fill = document.getElementById('progress-fill');
  const thumb = document.getElementById('progress-thumb');
  if (fill) fill.style.width = (pct * 100) + '%';
  if (thumb) thumb.style.right = (pct * 100) + '%';
  if (ytPlayer && ytPlayer.getDuration) {
    const dur = ytPlayer.getDuration();
    const curEl = document.getElementById('cur-time');
    if (curEl && dur) curEl.textContent = fmtTime(pct * dur);
  }
}

function commitSeek(pct) {
  if (ytPlayer && ytPlayer.getDuration) {
    const dur = ytPlayer.getDuration();
    if (dur) ytPlayer.seekTo(pct * dur, true);
  }
}

function attachProgressTrackEvents() {
  const track = document.getElementById('progress-track');
  if (!track || track.dataset.dragBound) return;
  track.dataset.dragBound = '1';

  track.addEventListener('pointerdown', (ev) => {
    isDraggingProgress = true;
    track.classList.add('dragging');
    stopProgressPoll();
    try { track.setPointerCapture(ev.pointerId); } catch (e) {}
    const pct = pctFromPointerEvent(ev, track);
    setProgressVisual(pct);
    commitSeek(pct);
    ev.preventDefault();
  });
  track.addEventListener('pointermove', (ev) => {
    if (!isDraggingProgress) return;
    const pct = pctFromPointerEvent(ev, track);
    setProgressVisual(pct);
  });
  const endDrag = (ev) => {
    if (!isDraggingProgress) return;
    isDraggingProgress = false;
    track.classList.remove('dragging');
    const pct = pctFromPointerEvent(ev, track);
    commitSeek(pct);
    if (state.isPlaying) startProgressPoll();
  };
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);
}

function renderPlayerBar() {
  const controls = document.getElementById('player-bar-controls');
  if (state.queueIndex < 0 && !state.loadingTrack) {
    controls.innerHTML = '<div class="placeholder-player">בחר שיר כדי לנגן את השיר המלא ביוטיוב</div>';
    return;
  }
  if (state.loadingTrack) {
    controls.innerHTML = `
      <div class="now-playing-meta">
        <div class="t">${escapeHtml(state.loadingTrack.title)}</div>
        <div class="a">מחפש ביוטיוב...</div>
      </div>
    `;
    return;
  }
  const t = state.queue[state.queueIndex];
  let curSec = 0, durSec = 0;
  if (ytPlayer && ytPlayer.getCurrentTime && ytPlayer.getDuration) {
    curSec = ytPlayer.getCurrentTime() || 0;
    durSec = ytPlayer.getDuration() || 0;
  }
  const initialPct = durSec ? (curSec / durSec * 100) : 0;
  controls.innerHTML = `
    <div class="now-playing-meta">
      <div class="t">${escapeHtml(t.title)}</div>
      <div class="a">${escapeHtml(t.artist)}</div>
    </div>
    <div class="transport">
      <button onclick="playPrev()" ${state.queueIndex<=0?'disabled':''}>⏮</button>
      <button class="play-pause" onclick="togglePlayPause()">${state.isPlaying ? '❚❚' : '▶'}</button>
      <button onclick="playNext()" ${state.queueIndex+1>=state.queue.length?'disabled':''}>⏭</button>
    </div>
    <div class="progress-wrap">
      <span id="cur-time">${fmtTime(curSec)}</span>
      <div class="progress-track" id="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:${initialPct}%"></div>
        <div class="progress-thumb" id="progress-thumb" style="right:${initialPct}%"></div>
      </div>
      <span id="dur-time">${fmtTime(durSec)}</span>
    </div>
    <div class="volume-wrap">
      <span style="font-size:13px;">🔊</span>
      <input type="range" min="0" max="100" step="5" value="100" oninput="ytPlayer && ytPlayer.setVolume && ytPlayer.setVolume(this.value)">
    </div>
  `;
  attachProgressTrackEvents();
}

loadCrates();
renderMain();
renderPlayerBar();
</script>
