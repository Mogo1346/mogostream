<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>שיחת וידאו</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1020;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 70px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #11182b;
      border-bottom: 1px solid #222b43;
    }

    .logo {
      font-size: 21px;
      font-weight: 700;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #aeb8d0;
      font-size: 14px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #777;
    }

    .dot.online {
      background: #31d17c;
    }

    main {
      flex: 1;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .join-card {
      width: min(440px, 100%);
      background: #11182b;
      border: 1px solid #222b43;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .join-card h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .join-card p {
      color: #9ca8c3;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #c9d1e5;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #303b59;
      border-radius: 12px;
      background: #0b1020;
      color: white;
      outline: none;
      font-size: 16px;
      margin-bottom: 16px;
    }

    input:focus {
      border-color: #667eea;
    }

    button {
      border: 0;
      cursor: pointer;
      color: white;
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      padding: 13px 18px;
      transition: .15s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary {
      width: 100%;
      background: #667eea;
    }

    .primary:hover {
      background: #7188f0;
    }

    .call {
      width: 100%;
      height: calc(100vh - 118px);
      display: none;
      position: relative;
    }

    .videos {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }

    .video-box {
      position: relative;
      min-height: 260px;
      overflow: hidden;
      border-radius: 18px;
      background: #151c30;
      border: 1px solid #252f49;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #080c17;
    }

    .video-label {
      position: absolute;
      right: 12px;
      bottom: 12px;
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(0,0,0,.55);
      font-size: 13px;
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      padding: 10px;
      border-radius: 18px;
      background: rgba(17,24,43,.92);
      border: 1px solid #303b59;
      backdrop-filter: blur(10px);
    }

    .control {
      width: 48px;
      height: 48px;
      padding: 0;
      display: grid;
      place-items: center;
      background: #26304a;
      font-size: 20px;
    }

    .control.active {
      background: #3a4767;
    }

    .control.danger {
      background: #dc4454;
    }

    .room-info {
      position: absolute;
      top: 15px;
      left: 15px;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(0,0,0,.55);
      color: #dce2f1;
      font-size: 13px;
      direction: ltr;
    }

    .error {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(220,68,84,.12);
      border: 1px solid rgba(220,68,84,.35);
      color: #ff9ba6;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      main {
        padding: 14px;
      }

      .call {
        height: calc(100vh - 98px);
      }

      header {
        padding: 0 15px;
      }

      .controls {
        bottom: 12px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">📞 VideoCall</div>

    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">לא מחובר</span>
    </div>
  </header>

  <main>

    <!-- מסך כניסה -->
    <section id="joinCard" class="join-card">

      <h1>שיחת וידאו</h1>

      <p>
        הזן שם חדר כדי ליצור שיחה או להצטרף לחדר קיים.
      </p>

      <label for="roomInput">Room ID</label>

      <input
        id="roomInput"
        type="text"
        placeholder="לדוגמה: my-room-123"
        autocomplete="off"
      />

      <label for="nameInput">השם שלך</label>

      <input
        id="nameInput"
        type="text"
        placeholder="השם שיוצג בשיחה"
        autocomplete="off"
      />

      <button id="joinButton" class="primary">
        🎥 הצטרף לשיחה
      </button>

      <div id="errorBox" class="error"></div>

    </section>

    <!-- מסך השיחה -->
    <section id="call" class="call">

      <div id="videos" class="videos">

        <div class="video-box">
          <video id="localVideo" autoplay muted playsinline></video>
          <div class="video-label" id="localLabel">אתה</div>
        </div>

      </div>

      <div id="roomInfo" class="room-info"></div>

      <div class="controls">

        <button
          id="micButton"
          class="control active"
          title="מיקרופון"
        >
          🎙️
        </button>

        <button
          id="cameraButton"
          class="control active"
          title="מצלמה"
        >
          📹
        </button>

        <button
          id="leaveButton"
          class="control danger"
          title="יציאה"
        >
          ☎️
        </button>

      </div>

    </section>

  </main>

</div>

<script>
  /*
   * ==========================================================
   * METERED CONFIG
   * ==========================================================
   *
   * אל תכניס כאן את ה-sk_secret.
   *
   * אם Metered מספק לך API key ציבורי לשימוש בדפדפן,
   * הכנס אותו כאן.
   */

  const METERED_API_KEY = "PASTE_PUBLIC_KEY_HERE";

  /*
   * אם יש לך Subdomain של Metered:
   *
   * לדוגמה:
   *
   * const METERED_DOMAIN = "yourapp.metered.live";
   *
   */

  const METERED_DOMAIN = "PASTE_YOUR_DOMAIN_HERE";


  // ==========================================================
  // STATE
  // ==========================================================

  let localStream = null;
  let micEnabled = true;
  let cameraEnabled = true;

  const peers = new Map();


  // ==========================================================
  // ELEMENTS
  // ==========================================================

  const joinCard = document.getElementById("joinCard");
  const call = document.getElementById("call");

  const roomInput = document.getElementById("roomInput");
  const nameInput = document.getElementById("nameInput");

  const joinButton = document.getElementById("joinButton");

  const localVideo = document.getElementById("localVideo");
  const localLabel = document.getElementById("localLabel");

  const videos = document.getElementById("videos");

  const micButton = document.getElementById("micButton");
  const cameraButton = document.getElementById("cameraButton");
  const leaveButton = document.getElementById("leaveButton");

  const roomInfo = document.getElementById("roomInfo");

  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");

  const errorBox = document.getElementById("errorBox");


  // ==========================================================
  // HELPERS
  // ==========================================================

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = "block";
  }

  function clearError() {
    errorBox.textContent = "";
    errorBox.style.display = "none";
  }

  function setStatus(online, text) {
    statusDot.classList.toggle("online", online);
    statusText.textContent = text;
  }


  // ==========================================================
  // GET CAMERA + MICROPHONE
  // ==========================================================

  async function getLocalMedia() {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      throw new Error(
        "הדפדפן לא מאפשר גישה למצלמה ולמיקרופון."
      );
    }

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
      });

    localStream = stream;

    localVideo.srcObject = stream;

    return stream;
  }


  // ==========================================================
  // JOIN
  // ==========================================================

  async function joinCall() {

    clearError();

    const roomId = roomInput.value.trim();
    const name = nameInput.value.trim() || "אורח";

    if (!roomId) {
      showError("נא להזין Room ID.");
      return;
    }

    joinButton.disabled = true;
    joinButton.textContent = "מתחבר...";

    try {

      await getLocalMedia();

      localLabel.textContent = name;

      roomInfo.textContent =
        "Room: " + roomId;

      joinCard.style.display = "none";
      call.style.display = "block";

      setStatus(true, "מחובר");

      /*
       * ======================================================
       * כאן מתחבר ה-Metered SDK.
       *
       * בכוונה לא שמנו כאן את ה-secret שלך.
       *
       * ======================================================
       */

      await connectToMetered(roomId, name);

    } catch (error) {

      console.error(error);

      showError(
        error.message ||
        "לא הצלחנו להתחבר לשיחה."
      );

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

    } finally {

      joinButton.disabled = false;
      joinButton.textContent = "🎥 הצטרף לשיחה";
    }
  }


  // ==========================================================
  // METERED CONNECTION
  // ==========================================================

  async function connectToMetered(roomId, name) {

    /*
     * כאן צריך להשתמש ב-SDK/endpoint המדויק שמוגדר
     * באפליקציית Metered שלך.
     *
     * אל תשים כאן sk_secret.
     */

    console.log("Connecting to Metered...");
    console.log({
      domain: METERED_DOMAIN,
      roomId,
      name
    });

    /*
     * ה-MVP המקומי עדיין מפעיל את המצלמה והמיקרופון.
     *
     * אחרי שמכניסים את ה-SDK של Metered,
     * המשתתפים האחרים יופיעו בתוך #videos.
     */
  }


  // ==========================================================
  // MICROPHONE
  // ==========================================================

  micButton.addEventListener("click", () => {

    if (!localStream) return;

    const audioTracks = localStream.getAudioTracks();

    if (!audioTracks.length) return;

    micEnabled = !micEnabled;

    audioTracks.forEach(track => {
      track.enabled = micEnabled;
    });

    micButton.textContent =
      micEnabled ? "🎙️" : "🔇";

    micButton.classList.toggle(
      "active",
      micEnabled
    );
  });


  // ==========================================================
  // CAMERA
  // ==========================================================

  cameraButton.addEventListener("click", () => {

    if (!localStream) return;

    const videoTracks = localStream.getVideoTracks();

    if (!videoTracks.length) return;

    cameraEnabled = !cameraEnabled;

    videoTracks.forEach(track => {
      track.enabled = cameraEnabled;
    });

    cameraButton.textContent =
      cameraEnabled ? "📹" : "🚫";

    cameraButton.classList.toggle(
      "active",
      cameraEnabled
    );
  });


  // ==========================================================
  // LEAVE
  // ==========================================================

  function leaveCall() {

    if (localStream) {

      localStream.getTracks().forEach(track => {
        track.stop();
      });

      localStream = null;
    }

    for (const [id, peer] of peers) {

      try {
        peer.close();
      } catch (e) {}

      removeRemoteVideo(id);
    }

    peers.clear();

    call.style.display = "none";
    joinCard.style.display = "block";

    setStatus(false, "לא מחובר");

    micEnabled = true;
    cameraEnabled = true;

    micButton.textContent = "🎙️";
    cameraButton.textContent = "📹";

    micButton.classList.add("active");
    cameraButton.classList.add("active");
  }


  leaveButton.addEventListener(
    "click",
    leaveCall
  );


  // ==========================================================
  // REMOTE VIDEO
  // ==========================================================

  function addRemoteVideo(id, stream, name = "משתתף") {

    if (document.getElementById("remote-" + id)) {
      return;
    }

    const box = document.createElement("div");

    box.className = "video-box";
    box.id = "remote-" + id;

    const video = document.createElement("video");

    video.autoplay = true;
    video.playsInline = true;
    video.srcObject = stream;

    const label = document.createElement("div");

    label.className = "video-label";
    label.textContent = name;

    box.appendChild(video);
    box.appendChild(label);

    videos.appendChild(box);
  }


  function removeRemoteVideo(id) {

    const element =
      document.getElementById("remote-" + id);

    if (element) {
      element.remove();
    }
  }


  // ==========================================================
  // ENTER KEY
  // ==========================================================

  roomInput.addEventListener("keydown", event => {

    if (event.key === "Enter") {
      joinCall();
    }
  });

  nameInput.addEventListener("keydown", event => {

    if (event.key === "Enter") {
      joinCall();
    }
  });


  joinButton.addEventListener(
    "click",
    joinCall
  );


  // ==========================================================
  // INITIAL STATE
  // ==========================================================

  setStatus(false, "לא מחובר");

</script>

</body>
</html>
