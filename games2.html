<style>
  :root{
    --bg-1:#161129;
    --bg-2:#1f1a3d;
    --panel:#211a42;
    --panel-2:#2a2154;
    --ink:#f3f0ff;
    --ink-dim:#b3aad6;
    --line:rgba(255,255,255,.08);
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Rubik', Arial, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% -10%, rgba(124,140,255,.30), transparent 45%),
      radial-gradient(circle at 90% 0%, rgba(255,91,158,.22), transparent 40%),
      radial-gradient(circle at 50% 120%, rgba(51,214,192,.18), transparent 45%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2) 60%, #120d24 100%);
    background-attachment:fixed;
    padding-bottom:60px;
  }

  /* ---------- header ---------- */
  header{
    position:sticky;
    top:0;
    z-index:50;
    backdrop-filter:blur(14px);
    background:rgba(17,13,36,.72);
    border-bottom:1px solid var(--line);
    padding:22px 20px 16px;
  }
  .header-inner{max-width:1180px;margin:0 auto;}
  .title-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
  }
  h1{
    font-family:'Suez One', 'Rubik', serif;
    font-weight:400;
    font-size:clamp(28px, 4vw, 42px);
    margin:0;
    letter-spacing:.5px;
    background:linear-gradient(90deg,#7c8cff,#ff5b9e 45%,#ffd23f 85%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    line-height:1.15;
  }
  .subtitle{
    color:var(--ink-dim);
    font-size:14.5px;
    margin-top:4px;
  }
  .game-count-pill{
    font-size:13px;
    color:var(--ink-dim);
    background:var(--panel);
    border:1px solid var(--line);
    padding:6px 14px;
    border-radius:999px;
    white-space:nowrap;
  }

  .search-row{
    margin-top:16px;
    display:flex;
    gap:10px;
  }
  .search-box{
    position:relative;
    flex:1;
    max-width:420px;
  }
  .search-box input{
    width:100%;
    padding:12px 44px 12px 16px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    font-family:inherit;
    font-size:15px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .search-box input::placeholder{color:var(--ink-dim);}
  .search-box input:focus{
    border-color:#7c8cff;
    box-shadow:0 0 0 3px rgba(124,140,255,.25);
  }
  .search-box .icon{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    font-size:16px;
    opacity:.6;
    pointer-events:none;
  }

  .chip-row{
    margin-top:14px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .chip{
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink-dim);
    background:var(--panel);
    border:1px solid var(--line);
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    transition:transform .12s ease, color .15s, border-color .15s, background .15s;
  }
  .chip span{font-size:15px;}
  .chip:hover{transform:translateY(-1px);}
  .chip.active{
    color:#181228;
    background:var(--accent);
    border-color:var(--accent);
    font-weight:700;
  }
  .chip#chip-all.active{
    color:var(--ink);
    background:var(--panel-2);
    border-color:#7c8cff;
  }

  /* ---------- sections ---------- */
  main{max-width:1180px;margin:0 auto;padding:28px 20px 0;}
  .cat-section{margin-top:34px;}
  .cat-section:first-of-type{margin-top:26px;}
  .cat-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:19px;
    font-weight:700;
    margin:0 0 14px;
    padding-right:12px;
    border-right:4px solid var(--accent);
  }
  .cat-emoji{font-size:20px;}
  .cat-count{
    margin-right:auto;
    font-size:12.5px;
    font-weight:500;
    color:var(--ink-dim);
  }

  .game-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(128px, 1fr));
    gap:12px;
  }

  .game-card{
    position:relative;
    aspect-ratio:1/1;
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    padding:0;
    cursor:pointer;
    background:var(--panel);
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .game-card:hover, .game-card:focus-visible{
    transform:translateY(-4px) scale(1.035);
    border-color:var(--accent);
    box-shadow:0 10px 24px -8px rgba(0,0,0,.55), 0 0 0 1px var(--accent), 0 0 22px -4px var(--accent);
    outline:none;
  }
  .game-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .game-card.no-img img{display:none;}
  .game-card.no-img{
    background:linear-gradient(135deg, var(--panel), var(--panel-2));
  }
  .game-card.no-img::before{
    content:"🎲";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    opacity:.5;
  }
  /* הצללה תחתונה – מתווספת אוטומטית לכל כרטיס */
  .game-card::after{
    content:"";
    position:absolute;
    inset:auto 0 0 0;
    height:56%;
    background:linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,0));
    pointer-events:none;
  }
  .card-label{
    position:absolute;
    z-index:1;
    right:8px;
    bottom:7px;
    left:8px;
    font-size:12.5px;
    font-weight:700;
    line-height:1.25;
    color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.7);
    pointer-events:none;
  }

  .empty-state{
    display:none;
    text-align:center;
    color:var(--ink-dim);
    padding:60px 20px;
    font-size:15px;
  }
  .empty-state.show{display:block;}

  footer{
    max-width:1180px;
    margin:40px auto 0;
    padding:20px;
    text-align:center;
    color:var(--ink-dim);
    font-size:12.5px;
    border-top:1px solid var(--line);
  }

  @media (max-width:520px){
    .game-grid{grid-template-columns:repeat(auto-fill, minmax(104px,1fr));}
    h1{font-size:26px;}
  }
</style>
</head>

    img: "https://tse3.mm.bing.net/th/id/OIP.Y95Nm8f6SdL9_M0tt_JHCgHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" }
];


/* =====================================================================
   3. קוד ה-UI – אין צורך לגעת בו כשמוסיפים משחקים או קטגוריות
   ===================================================================== */
const DEFAULT_CATEGORY_STYLE = { emoji: "🎲", color: "#b3aad6" };

function openGame(url, name) {
  localStorage.setItem("gameUrl", url);
  localStorage.setItem("gameName", name || "");
  window.location.href = "game_player.html";
}

(function () {
  const main        = document.getElementById('main');
  const chipRow     = document.getElementById('chipRow');
  const searchInput = document.getElementById('searchInput');
  const emptyState  = document.getElementById('emptyState');
  const countPill   = document.getElementById('gameCount');

  // קיבוץ המשחקים לפי קטגוריה. קטגוריות מוגדרות קודם (לפי הסדר), ואחריהן קטגוריות "לא מוכרות"
  const grouped = new Map(Object.keys(CATEGORIES).map(c => [c, []]));
  GAMES.forEach(game => {
    if (!grouped.has(game.category)) {
      console.warn(`קטגוריה לא מוגדרת: "${game.category}" (המשחק "${game.name}") – נוצרה אוטומטית`);
      grouped.set(game.category, []);
    }
    grouped.get(game.category).push(game);
  });

  const sections = [];   // { catName, el, countEl, cards: [{ el, name }] }
  const chips    = [];
  let activeCat  = 'all';

  function buildCard(game, color) {
    const btn = document.createElement('button');
    btn.className = 'game-card';
    btn.style.setProperty('--accent', color);
    btn.addEventListener('click', () => openGame(game.url, game.name));

    if (game.img) {
      const img = document.createElement('img');
      img.src = game.img;
      img.alt = game.name;
      img.loading = 'lazy';
      img.onerror = () => btn.classList.add('no-img');
      btn.appendChild(img);
    } else {
      btn.classList.add('no-img');
    }

    const label = document.createElement('span');
    label.className = 'card-label';
    label.textContent = game.name;
    btn.appendChild(label);

    return btn;
  }

  function buildSection(catName, games) {
    const style = CATEGORIES[catName] || DEFAULT_CATEGORY_STYLE;

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.style.setProperty('--accent', style.color);

    const title = document.createElement('h2');
    title.className = 'cat-title';
    title.innerHTML = '<span class="cat-emoji"></span><span class="cat-name"></span><span class="cat-count"></span>';
    title.querySelector('.cat-emoji').textContent = style.emoji;
    title.querySelector('.cat-name').textContent  = catName;
    section.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'game-grid';
    const cards = games.map(game => {
      const el = buildCard(game, style.color);
      grid.appendChild(el);
      return { el, name: game.name.toLowerCase() };
    });
    section.appendChild(grid);

    main.insertBefore(section, emptyState);
    sections.push({ catName, el: section, countEl: title.querySelector('.cat-count'), cards });
  }

  function buildChip(catName) {
    const style = CATEGORIES[catName] || DEFAULT_CATEGORY_STYLE;
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.style.setProperty('--accent', style.color);
    chip.innerHTML = '<span></span>';
    chip.querySelector('span').textContent = style.emoji;
    chip.appendChild(document.createTextNode(catName));
    chip.addEventListener('click', () => setCategory(catName, chip));
    chipRow.appendChild(chip);
    chips.push(chip);
  }

  function setCategory(cat, chip) {
    chips.forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeCat = cat;
    applyFilters();
  }

  function applyFilters() {
    const q = searchInput.value.trim().toLowerCase();
    let anyVisible = false;

    sections.forEach(s => {
      const catMatches = activeCat === 'all' || activeCat === s.catName;
      let visible = 0;

      s.cards.forEach(card => {
        const show = catMatches && (!q || card.name.includes(q));
        card.el.style.display = show ? '' : 'none';
        if (show) visible++;
      });

      s.el.style.display = visible > 0 ? '' : 'none';
      s.countEl.textContent = `${visible} משחקים`;
      if (visible > 0) anyVisible = true;
    });

    emptyState.classList.toggle('show', !anyVisible);
  }

  // בניית הדף
  const allChip = document.getElementById('chip-all');
  chips.push(allChip);
  allChip.addEventListener('click', () => setCategory('all', allChip));

  grouped.forEach((games, catName) => {
    if (games.length === 0) return;   // קטגוריה בלי משחקים לא מוצגת
    buildChip(catName);
    buildSection(catName, games);
  });

  countPill.textContent = `${GAMES.length} משחקים זמינים`;
  searchInput.addEventListener('input', applyFilters);
  applyFilters();
})();
</script>

</body>
</html>
