<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>מוגו סטרים</title>
    <style>
        .buttons {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 5px;
            row-gap: 5px;
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        button {
            border: none;
            background: none;
            padding: 0;
            cursor: pointer;
            transition: transform 0.2s ease;
            aspect-ratio: 1 / 1;
        }
        button:hover {
            transform: scale(1.1);
        }
        button img {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<h1>כל הסטרימים של מוגו!</h1>

<div class="buttons">
    <button onclick="window.location.href='channels.html'">
        <img src="https://cdn-icons-png.flaticon.com/128/7733/7733346.png">
    </button>
    <button onclick="window.location.href='VOD.html'">
        <img src="https://cdn-icons-png.flaticon.com/128/2504/2504929.png">
    </button>
    <button onclick="window.location.href='radio.html'">
        <img src="https://cdn-icons-png.flaticon.com/128/4345/4345664.png">
    </button>
    <button onclick="window.location.href='games.html'">
        <img src="https://cdn-icons-png.flaticon.com/128/10855/10855296.png">
    </button>
    <button onclick="window.location.href='studies.html'">
        <img src="https://cdn-icons-png.flaticon.com/128/3534/3534033.png">
    </button>
</div>

<script>
function goToChannel(url) {
    // מעביר לדף הנגן עם כתובת ה-M3U8 בפרמטר
    window.location.href = 'player.html?src=' + encodeURIComponent(url);
}
</script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js");
    });
}
</script>

</body>
</html>
