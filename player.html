<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>נגן וידאו IPTV</title>
    <!-- ספריית hls.js לניגון שידורי m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #020617;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            background: #334155;
            color: #f8fafc;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: #475569;
        }

        .channel-title {
            font-size: 1.3rem;
            color: #3b82f6;
            margin: 0;
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #1e293b;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #error-message {
            color: #ef4444;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 class="channel-title" id="channel-name">טוען ערוץ...</h1>
            <a href="channels.html" class="back-btn">➜ חזור לרשימת הערוצים</a>
        </div>

        <div class="video-wrapper">
            <video id="video-player" controls autoplay></video>
        </div>

        <div id="error-message">לא ניתן לטעון ערוץ זה. הקישור עשוי להיות שבור או חסום לצפייה ישירה בדפדפן.</div>
    </div>

    <script>
        // שליפת פרמטרי ה-URL
        const urlParams = new URLSearchParams(window.location.search);
        const streamUrl = urlParams.get('url');
        const channelName = urlParams.get('name');

        const videoElement = document.getElementById('video-player');
        const channelNameElement = document.getElementById('channel-name');
        const errorMessage = document.getElementById('error-message');

        if (channelName) {
            channelNameElement.innerText = decodeURIComponent(channelName);
            document.title = `${decodeURIComponent(channelName)} - נגן IPTV`;
        }

        if (streamUrl) {
            playStream(decodeURIComponent(streamUrl));
        } else {
            channelNameElement.innerText = 'שגיאה: לא נבחר ערוץ לצפייה';
        }

        function playStream(url) {
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(videoElement);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    videoElement.play().catch(() => {});
                });

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        errorMessage.style.display = 'block';
                    }
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                // תמיכה ב-Safari
                videoElement.src = url;
                videoElement.addEventListener('loadedmetadata', function () {
                    videoElement.play();
                });
            } else {
                errorMessage.style.display = 'block';
                errorMessage.innerText = 'הדפדפן שלך אינו תומך בניגון HLS.';
            }
        }
    </script>
</body>
</html>
