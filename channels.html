        body {

            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #3b82f6;
            margin-bottom: 30px;
        }
        #loading {
            text-align: center;
            font-size: 1.2rem;
            color: #f59e0b;
            margin-top: 50px;
        }
        details {
            background: #1e293b;
            margin-bottom: 12px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        summary {
            background: #1e293b;
            color: #f8fafc;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        summary:hover {
            background: #334155;
        }
        summary::-webkit-details-marker {
            display: none;
        }
        summary::after {
            content: "+";
            font-size: 1.4rem;
        }
        details[open] summary::after {
            content: "-";
        }
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            padding: 20px;
            background: #0f172a;
        }
        .channel-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: transform 0.2s, border-color 0.2s;
        }
        .channel-card:hover {
            transform: translateY(-3px);
            border-color: #3b82f6;
        }
        .channel-card img {
            max-width: 90px;
            height: 50px;
            object-fit: contain;
        }
        .channel-card strong {
            font-size: 0.9rem;
            color: #f8fafc;
            line-height: 1.2;
        }
        .play-link {
            display: block;
            width: 100%;
            padding: 8px 0;
            background: #3b82f6;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        .play-link:hover {
            background: #2563eb;
        }

        function renderDOM(groupedByCountry) {
            const container = document.getElementById('countries-container');
            const sortedCountries = Object.keys(groupedByCountry).sort();

            sortedCountries.forEach(countryName => {
                const channels = groupedByCountry[countryName];

                const details = document.createElement('details');
                const summary = document.createElement('summary');
                summary.innerText = `${countryName} (${channels.length} ערוצים)`;

                const grid = document.createElement('div');
                grid.className = 'channels-grid';

                channels.forEach(channel => {
                    const card = document.createElement('div');
                    card.className = 'channel-card';

                    const img = document.createElement('img');
                    img.loading = 'lazy';
                    img.alt = channel.name;
                    img.referrerPolicy = 'no-referrer';

                    img.addEventListener('error', function() {
                        this.onerror = null;
                        this.src = DEFAULT_LOGO;
                    });

                    img.src = channel.logo ? channel.logo : DEFAULT_LOGO;

                    const strongName = document.createElement('strong');
                    strongName.innerText = channel.name;

                    // הקישור מוביל לקובץ player.html ומעביר את שם הערוץ והכתובת
                    const playLink = document.createElement('a');
                    playLink.className = 'play-link';
                    playLink.innerText = '▶ נגן ערוץ';
                    playLink.href = `player.html?url=${encodeURIComponent(channel.url)}&name=${encodeURIComponent(channel.name)}`;

                    card.appendChild(img);
                    card.appendChild(strongName);
                    card.appendChild(playLink);
                    grid.appendChild(card);
                });

                details.appendChild(summary);
                details.appendChild(grid);
                container.appendChild(details);
            });

            document.getElementById('loading').style.display = 'none';
        }

        fetchAndRenderData();
